server:
  port: ${PORT:8080}

spring:
  application:
    name: paytm-wallet
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paytm_wallet}
    username: ${DB_USERNAME:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      maximum-pool-size: 5  # Scaled down to prevent exhausting Render PostgreSQL limits
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: "always"

wallet:
  initial-balance-paise: ${INITIAL_BALANCE_PAISE:100000}